site_name: "LightDiffusion-Next"
site_url: "https://aatricks.github.io/LightDiffusion-Next"
site_description: "Blazing fast Stable Diffusion web UI backend"
site_author: "Aatricks"
dev_addr: "127.0.0.1:8080"
repo_url: "https://github.com/Aatricks/LightDiffusion-Next"
theme:
  name: shadcn
  icon: null
  pygments_style:
    light: shadcn-light
    dark: github-dark
  katex_options:
    macros:
      "\\dx": "\\mathrm{d}x"
  # show_datetime: true

nav:
  - Overview: index.md
  - Getting Started:
    - Installation: installation.md
    - First Run & UI Tour: usage.md
    - Workflow Playbook: examples.md
  - Deep Dive:
    - Architecture: architecture.md
    - REST API: api.md
  - Operations:
    - Performance & Troubleshooting: quirks.md
    - FAQ: faq.md
  - Contributing: contributing.md
plugins:
  - search
  - excalidraw
  - mkdocstrings

markdown_extensions:
  admonition:
  codehilite:
  fenced_code:
  footnotes:
  extra:
  pymdownx.blocks.details:
  pymdownx.tabbed:
  pymdownx.blocks.tab:
    combine_header_slug: true
    separator: ___
  pymdownx.progressbar:
  pymdownx.snippets:
  pymdownx.arithmatex:
    generic: true
  shadcn.extensions.echarts.alpha:
  shadcn.extensions.codexec:
  shadcn.extensions.iconify:
  pymdownx.blocks.caption:
